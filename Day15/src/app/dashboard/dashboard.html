<div class="container py-5">

  <h2 class="mb-4">
    Employee Dashboard
  </h2>

  <div class="row g-4">

    <div class="col-12 col-md-4">
      <div class="card shadow">
        <div class="card-body">
          <h5 class="card-title">Employees</h5>
          <h2>25</h2>
          <p class="card-text">
            Total employees
          </p>
        </div>
      </div>
    </div>

    <div class="col-12 col-md-4">
      <div class="card shadow">
        <div class="card-body">
          <h5 class="card-title">Department</h5>
          <h2>IT</h2>
          <p class="card-text">
            Your department
          </p>
        </div>
      </div>
    </div>

    <div class="col-12 col-md-4">
      <div class="card shadow">
        <div class="card-body">
          <h5 class="card-title">Status</h5>
          <h2>Active</h2>
          <p class="card-text">
            Current session
          </p>
        </div>
      </div>
    </div>

  </div>

  <div class="card shadow mt-5">

    <div class="card-body">

      <h4 class="mb-4">
        Employee List
      </h4>

      <div class="table-responsive">

        <table class="table table-striped table-hover">

          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Department</th>
              <th>Status</th>
            </tr>
          </thead>

          <tbody>

            <tr>
              <td>1</td>
              <td>Anuneha Peteti</td>
              <td>IT</td>
              <td>Active</td>
            </tr>

            <tr>
              <td>2</td>
              <td>Rahul Kumar</td>
              <td>HR</td>
              <td>Active</td>
            </tr>

            <tr>
              <td>3</td>
              <td>Priya Sharma</td>
              <td>Finance</td>
              <td>Active</td>
            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>

</div>
